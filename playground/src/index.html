<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>RedSAT Playground</title>
    <meta
      name="description"
      content="Write programs with unknowns in an imperative style; RedSAT compiles them to SAT and solves them, right in your browser."
    />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // A service worker adds the headers that make the page cross-origin isolated (GitHub Pages
      // cannot) and keeps an offline copy of the playground; see sw.js. The page reloads once to become
      // isolated; without service workers everything still works, Stop just restarts a worker.
      if ('serviceWorker' in navigator && window.isSecureContext) {
        // A new version of the playground took over this open page (after a deploy): reload, so
        // that every file comes from that version. At most once every 10 seconds, so never a loop.
        const startedWith = navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!startedWith) return; // the first visit, handled below
          const last = Number(sessionStorage.getItem('redsat.updated') ?? 0);
          if (Date.now() - last < 10000) return;
          sessionStorage.setItem('redsat.updated', String(Date.now()));
          location.reload();
        });
        // Controlled but not yet isolated (the first visit): reload once per session to become so.
        navigator.serviceWorker.register('sw.js').then(async () => {
          await navigator.serviceWorker.ready;
          const isolate = () => {
            if (window.crossOriginIsolated || sessionStorage.getItem('redsat.isolating')) return;
            sessionStorage.setItem('redsat.isolating', '1');
            location.reload();
          };
          if (navigator.serviceWorker.controller) isolate();
          else navigator.serviceWorker.addEventListener('controllerchange', isolate, { once: true });
        });
      }
    </script>
    <script type="module" src="app.js"></script>
  </head>
  <body data-view="loading" data-tab="code">
    <header class="topbar">
      <a id="brand" class="brand" href="./" title="Home">
        <img src="favicon.svg" alt="" width="26" height="26" />
        <span class="wordmark">Red<b>SAT</b></span>
        <span class="badge">playground</span>
      </a>

      <button id="file-button" class="file-button" title="Open a file or an example" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z M9 1.5v3.5h3.5" /></svg>
        <span id="file-name">Choose a file</span>
        <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
      </button>
      <button id="new-file" class="ghost desktop-only" title="New file">+ New</button>

      <div class="spacer"></div>

      <div class="run-controls desktop-only">
        <button class="primary run-button" title="Run (Ctrl+Enter)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
          Run
        </button>
        <button class="danger stop-button" title="Stop (Esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" /></svg>
          Stop
        </button>
      </div>
      <nav class="links desktop-only">
        <button id="share" class="ghost" title="Copy a link to this program">Share</button>
        <a class="ghost" href="guide/">Guide</a>
      </nav>
      <button id="menu-button" class="icon-button mobile-only" aria-label="Menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" /><circle cx="8" cy="8" r="1.4" /><circle cx="13" cy="8" r="1.4" /></svg>
      </button>
    </header>

    <nav class="tabs mobile-only" role="tablist" aria-label="View">
      <button role="tab" data-tab-target="code">Code</button>
      <button role="tab" data-tab-target="output">Output <span id="output-dot" class="dot" hidden></span></button>
    </nav>

    <section id="loading" class="loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Loading the compiler…</p>
    </section>

    <main id="workspace" class="workspace">
      <section class="pane editor-pane" aria-label="Program">
        <div class="pane-head">
          <div class="about">
            <input id="doc-title" class="doc-title" aria-label="File name" spellcheck="false" autocomplete="off" />
            <p id="doc-description"></p>
          </div>
          <div class="doc-actions">
            <button id="reset" class="ghost small" title="Discard your changes to this example" hidden>Reset</button>
            <button id="save-copy" class="ghost small" title="Save a copy to your files" hidden>Save a copy</button>
            <button id="delete-file" class="ghost small danger-text" title="Delete this file" hidden>Delete</button>
          </div>
        </div>
        <p id="slow-note" class="note" hidden>
          <span id="slow-text"></span>
          <button id="use-cadical" class="small">Use CaDiCaL</button>
        </p>
        <div id="editor" class="editor"></div>
      </section>

      <div id="divider" class="divider" role="separator" aria-label="Resize"></div>

      <section class="pane output-pane" aria-label="Output">
        <div class="pane-head">
          <h2>Output</h2>
          <div id="options-slot">
            <div id="options" class="options">
              <label title="Report each phase: unknowns, search space, circuit and CNF sizes, timings">
                <input type="checkbox" id="verbose" /> Verbose
              </label>
              <label title="Strict mode: unknowns need explicit types and bounds">
                <input type="checkbox" id="strict" /> Strict
              </label>
              <div class="solver">
                <span>Solver</span>
                <span id="solver-slot"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="output" class="output" aria-live="polite"></div>
        <footer class="statusbar">
          <span id="status" class="status-text idle">Loading…</span>
          <span id="stats" class="stats"></span>
        </footer>
      </section>
    </main>

    <section id="home" class="home" hidden aria-label="Home"></section>

    <div class="mobilebar mobile-only">
      <div id="keys" class="keys" aria-label="Symbols"></div>
      <button class="primary run-button" aria-label="Run">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
        Run
      </button>
      <button class="danger stop-button" aria-label="Stop">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" /></svg>
        Stop
      </button>
    </div>

    <footer class="pagefoot desktop-only">
      <span id="version">RedSAT</span>
      <span>· the compiler and its SAT solvers run entirely in your browser</span>
    </footer>

    <dialog id="menu" class="sheet">
      <div class="sheet-body">
        <div class="sheet-grabber" aria-hidden="true"></div>
        <button id="menu-home" class="sheet-item">Your files &amp; examples</button>
        <button id="menu-new" class="sheet-item">+ New file</button>
        <button id="menu-share" class="sheet-item">Share a link</button>
        <a class="sheet-item" href="guide/">Guide</a>
        <h3>Options</h3>
        <div id="menu-options"></div>
        <button class="sheet-item close" data-close>Close</button>
      </div>
    </dialog>
    <div id="switcher" class="switcher" popover aria-label="Open a file or an example"></div>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
