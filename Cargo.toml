[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
redsat-sat = { path = "crates/redsat-sat", default-features = false }
redsat-circuit = { path = "crates/redsat-circuit" }
redsat-lang = { path = "crates/redsat-lang" }
rustsat = "0.7.5"
rustsat-cadical = "0.7.5"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
redsat-lsp = { path = "crates/redsat-lsp" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
