# Builds the web playground (the compiler compiled to WebAssembly) and the user guide, and
# publishes them on GitHub Pages: the playground at the site root, the guide under /guide/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Keep wasm-bindgen in step with the version pinned in crates/redsat-wasm/Cargo.toml.
          tool: wasm-bindgen@0.2.130,mdbook
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - name: Build the playground
        working-directory: playground
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the guide
        run: mdbook build docs/guide --dest-dir ../../playground/dist/guide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
