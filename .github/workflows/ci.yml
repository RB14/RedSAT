# Formatting, lints and the full test suite (CaDiCaL is built from source, which needs libclang),
# plus a WebAssembly build of the compiler and the playground's own tests.
name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install libclang (for the CaDiCaL bindings)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target wasm32-unknown-unknown -p redsat-wasm

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - working-directory: playground
        run: |
          npm ci
          npm test
